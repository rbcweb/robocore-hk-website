<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="PUDU MT1 Max AI outdoor & semi-outdoor robotic sweeper — Robocore Hong Kong" />
  <meta name="theme-color" content="#141416" />
  <link rel="icon" href="/assets/logo/favicon.png" type="image/png" />
  <title>Robocore Hong Kong</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body data-page="mt1">
  <div id="site-header-mount"></div>
  <main class="product-page">
    <section class="product-hero">
      <div class="container product-hero-grid">
        <div class="product-hero-copy reveal">
          <div class="breadcrumb">
            <a href="/" data-i18n="common.home"></a><span>/</span>
            <a href="/pudu/" data-i18n="nav.brand.pudu"></a><span>/</span>
            <span>MT1 Max</span>
          </div>
          <div class="product-kicker">Pudu</div>
          <h1>MT1 Max</h1>
          <p class="product-type" data-i18n="nav.type.bulkWaste"></p>
          <p class="product-lead" data-i18n="pudu.mt1.desc"></p>
          <div class="chip-row">
            <span class="chip" data-i18n="pudu.mt1.c1"></span>
            <span class="chip" data-i18n="pudu.mt1.c2"></span>
            <span class="chip" data-i18n="pudu.mt1.c3"></span>
          </div>
          <div class="hero-actions">
            <a class="btn btn-primary" href="/contactus/" data-i18n="common.contactCta"></a>
            <a class="btn btn-ghost" href="/pudu/" data-i18n="pudu.backSeries"></a>
          </div>
        </div>
        <div class="product-stage reveal">
          <img src="/assets/products/pudu/mt1.png" alt="MT1 Max" />
        </div>
      </div>
    </section>

    <section class="product-specs">
      <div class="container reveal">
        <header class="product-specs-head">
          <div>
            <div class="product-kicker">Pudu</div>
            <h2 data-i18n="pudu.specs"></h2>
          </div>
        </header>
        <div data-specs="mt1"></div>
      </div>
    </section>
  </main>
  <div id="site-footer-mount"></div>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
