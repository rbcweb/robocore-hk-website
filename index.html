<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Robocore Hong Kong — 專業機器人綜合解決方案供應商 | Professional robotics solutions" />
  <meta name="theme-color" content="#141416" />
  <link rel="icon" href="/assets/logo/favicon.png" type="image/png" />
  <title>首頁 | Robocore Hong Kong</title>
  <link rel="stylesheet" href="/src/css/main.css" />
  
</head>
<body data-page="index.html">
  <div id="site-header-mount"></div>
  <main>

    <section class="hero">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="container hero-content reveal">
        <div class="eyebrow">Robocore Hong Kong</div>
        <h1 data-i18n="home.heroTitle" data-i18n-html="true"></h1>
        <p class="lead" data-i18n="home.heroLead"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="solutions.html" data-i18n="common.explore"></a>
          <a class="btn btn-ghost" href="products.html" data-i18n="nav.products"></a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container split">
        <div class="reveal">
          <div class="section-kicker" data-i18n="home.aboutKicker"></div>
          <h2 data-i18n="home.aboutTitle" data-i18n-html="true" style="white-space:pre-line"></h2>
          <p data-i18n="home.aboutP1"></p>
          <p data-i18n="home.aboutP2"></p>
          <div class="stats">
            <div class="stat"><strong>30+</strong><span data-i18n="home.stat1"></span></div>
            <div class="stat"><strong>12</strong><span data-i18n="home.stat2"></span></div>
            <div class="stat"><strong>HK</strong><span data-i18n="home.stat3"></span></div>
          </div>
        </div>
        <div class="split-visual reveal">
          <img src="/assets/products/robot-group.jpeg" alt="Robocore robots" />
        </div>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <div class="section-kicker">Robocore</div>
            <h2 data-i18n="home.pillarsTitle"></h2>
          </div>
        </div>
        <div class="card-grid">
          <a class="card reveal" href="solutions.html">
            <h3 data-i18n="home.pillar1Title"></h3>
            <p data-i18n="home.pillar1Desc"></p>
            <span class="card-link" data-i18n="common.learnMore"></span>
          </a>
          <a class="card reveal" href="temifamily.html">
            <h3 data-i18n="home.pillar2Title"></h3>
            <p data-i18n="home.pillar2Desc"></p>
            <span class="card-link" data-i18n="common.learnMore"></span>
          </a>
          <a class="card reveal" href="pudu.html">
            <h3 data-i18n="home.pillar3Title"></h3>
            <p data-i18n="home.pillar3Desc"></p>
            <span class="card-link" data-i18n="common.learnMore"></span>
          </a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <div class="section-kicker" data-i18n="nav.products"></div>
            <h2 data-i18n="home.productsTitle"></h2>
            <p data-i18n="home.productsSub"></p>
          </div>
          <a class="btn btn-ghost" href="products.html" data-i18n="common.viewMore"></a>
        </div>
        <div class="product-strip product-strip-4">
          <a class="product-tile reveal" href="temiv3.html">
            <img src="/assets/products/temiv3-full.png" alt="temi v3" />
            <div class="caption"><h3>temi v3</h3><p data-i18n="prod.temiv3.tag"></p></div>
          </a>
          <a class="product-tile reveal" href="temigopro.html">
            <img src="/assets/products/temigopro.jpg" alt="temi GO PRO" />
            <div class="caption"><h3>temi GO PRO</h3><p data-i18n="prod.gopro.tag"></p></div>
          </a>
          <a class="product-tile reveal" href="pudu.html#pudubot">
            <img src="/assets/products/pudu.png" alt="PuduBot" style="object-fit:contain;padding:1.25rem" />
            <div class="caption"><h3>PuduBot</h3><p data-i18n="pudu.pudubot.tag"></p></div>
          </a>
          <a class="product-tile reveal" href="pudu.html#cc1">
            <img src="/assets/products/product1.png" alt="CC1" style="object-fit:contain;padding:1.25rem" />
            <div class="caption"><h3>CC1</h3><p data-i18n="pudu.cc1.tag"></p></div>
          </a>
        </div>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <h2 data-i18n="home.clientsTitle"></h2>
            <p data-i18n="home.clientsSub"></p>
          </div>
        </div>
        <div class="marquee reveal">
          <div class="marquee-track">
            <img src="/assets/clients/singtel.png" alt="Singtel" />
            <img src="/assets/clients/chinamobile.png" alt="China Mobile" />
            <img src="/assets/clients/tencent.png" alt="Tencent" />
            <img src="/assets/clients/hktdc.png" alt="HKTDC" />
            <img src="/assets/clients/dashi.png" alt="Dashi" />
            <img src="/assets/clients/miraplace.png" alt="Mira Place" />
            <img src="/assets/clients/en.png" alt="Client" />
            <img src="/assets/clients/singtel.png" alt="" />
            <img src="/assets/clients/chinamobile.png" alt="" />
            <img src="/assets/clients/tencent.png" alt="" />
            <img src="/assets/clients/hktdc.png" alt="" />
            <img src="/assets/clients/dashi.png" alt="" />
            <img src="/assets/clients/miraplace.png" alt="" />
            <img src="/assets/clients/en.png" alt="" />
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="cta-banner reveal">
          <div>
            <h2 data-i18n="home.ctaTitle"></h2>
            <p data-i18n="home.ctaSub"></p>
          </div>
          <a class="btn btn-primary" href="solutions.html" data-i18n="home.ctaBtn"></a>
        </div>
      </div>
    </section>

  </main>
  <div id="site-footer-mount"></div>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
