<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Robocore Hong Kong — 專業機械人綜合解決方案供應商 | Professional robotics solutions" />
  <meta name="theme-color" content="#141416" />
  <link rel="icon" href="/assets/logo/favicon.png" type="image/png" />
  <title>Robocore Hong Kong</title>
  <link rel="stylesheet" href="/src/css/main.css" />
  
</head>
<body data-page="index">
  <div id="site-header-mount"></div>
  <main>

    <section class="hero">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="container hero-content reveal">
        <div class="eyebrow">Robocore Hong Kong</div>
        <h1 data-i18n="home.heroTitle" data-i18n-html="true"></h1>
        <p class="lead" data-i18n="home.heroLead"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="/solutions/" data-i18n="common.explore"></a>
          <a class="btn btn-ghost" href="/products/" data-i18n="nav.products"></a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container split">
        <div class="reveal">
          <div class="section-kicker" data-i18n="home.aboutKicker"></div>
          <h2 data-i18n="home.aboutTitle" data-i18n-html="true" style="white-space:pre-line"></h2>
          <p data-i18n="home.aboutP1"></p>
          <p data-i18n="home.aboutP2"></p>
          <div class="stats">
            <div class="stat"><strong>30+</strong><span data-i18n="home.stat1"></span></div>
            <div class="stat"><strong>14+</strong><span data-i18n="home.stat2"></span></div>
            <div class="stat"><strong>SDK</strong><span data-i18n="home.stat3"></span></div>
          </div>
        </div>
        <div class="split-visual reveal">
          <img src="/assets/products/robot-group.jpg" alt="Robocore robots" />
        </div>
      </div>
    </section>

    <section class="section section-alt home-news">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <div class="section-kicker" data-i18n="nav.news"></div>
            <h2 data-i18n="home.newsTitle"></h2>
            <p data-i18n="home.newsSub"></p>
          </div>
          <a class="btn btn-ghost" href="/news/" data-i18n="common.viewMore"></a>
        </div>
        <div class="card-grid home-news-grid">
          <a class="card news-card reveal" href="/news-am730-sen-2026/">
            <span class="news-date" data-i18n="news.n3.date"></span>
            <span class="news-source-chip" data-i18n="news.n3.sourceChip"></span>
            <h3 data-i18n="news.n3.title"></h3>
            <p data-i18n="news.n3.desc"></p>
            <span class="card-link" data-i18n="news.readMore"></span>
          </a>
          <a class="card news-card reveal" href="/news-oncc-sen-2026/">
            <span class="news-date" data-i18n="news.n4.date"></span>
            <span class="news-source-chip" data-i18n="news.n4.sourceChip"></span>
            <h3 data-i18n="news.n4.title"></h3>
            <p data-i18n="news.n4.desc"></p>
            <span class="card-link" data-i18n="news.readMore"></span>
          </a>
          <a class="card news-card reveal" href="https://www.instagram.com/reels/DbQgChhzOKs/" target="_blank" rel="noopener noreferrer">
            <span class="news-date" data-i18n="news.n5.date"></span>
            <span class="news-source-chip" data-i18n="news.n5.sourceChip"></span>
            <h3 data-i18n="news.n5.title"></h3>
            <p data-i18n="news.n5.desc"></p>
            <span class="card-link" data-i18n="news.openExternal"></span>
          </a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <div class="section-kicker">Robocore</div>
            <h2 data-i18n="home.pillarsTitle"></h2>
          </div>
        </div>
        <div class="card-grid">
          <a class="card reveal" href="/solutions/">
            <h3 data-i18n="home.pillar1Title"></h3>
            <p data-i18n="home.pillar1Desc"></p>
            <span class="card-link" data-i18n="common.learnMore"></span>
          </a>
          <a class="card reveal" href="/temifamily/">
            <h3 data-i18n="home.pillar2Title"></h3>
            <p data-i18n="home.pillar2Desc"></p>
            <span class="card-link" data-i18n="common.learnMore"></span>
          </a>
          <a class="card reveal" href="/pudu/">
            <h3 data-i18n="home.pillar3Title"></h3>
            <p data-i18n="home.pillar3Desc"></p>
            <span class="card-link" data-i18n="common.learnMore"></span>
          </a>
        </div>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <div class="section-kicker" data-i18n="nav.products"></div>
            <h2 data-i18n="home.productsTitle"></h2>
            <p data-i18n="home.productsSub"></p>
          </div>
          <a class="btn btn-ghost" href="/products/" data-i18n="common.viewMore"></a>
        </div>
        <div class="product-strip product-strip-4">
          <a class="product-tile reveal" href="/temiv3/">
            <img src="/assets/products/temiv3-full.png" alt="temi v3" />
            <div class="caption"><h3>temi v3</h3><p data-i18n="nav.type.service"></p></div>
          </a>
          <a class="product-tile reveal" href="/temigopro/">
            <img src="/assets/products/temigopro-v2.jpg" alt="temi GO PRO" />
            <div class="caption"><h3>temi GO PRO</h3><p data-i18n="nav.type.buildingDelivery"></p></div>
          </a>
          <a class="product-tile reveal" href="/pudubot/">
            <img src="/assets/products/pudu/pudubot.png" alt="PuduBot 2" />
            <div class="caption"><h3>PuduBot 2</h3><p data-i18n="nav.type.foodDelivery"></p></div>
          </a>
          <a class="product-tile reveal" href="/bellabot/">
            <img src="/assets/products/pudu/bellabot-v2.png" alt="BellaBot" />
            <div class="caption"><h3>BellaBot</h3><p data-i18n="nav.type.premiumFood"></p></div>
          </a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <h2 data-i18n="home.clientsTitle"></h2>
            <p data-i18n="home.clientsSub"></p>
          </div>
        </div>
        <div class="marquee reveal">
          <div class="marquee-track">
            <img src="/assets/clients/singtel.png" alt="Singtel" />
            <img src="/assets/clients/chinamobile.png" alt="China Mobile" />
            <img src="/assets/clients/tencent.png" alt="Tencent" />
            <img src="/assets/clients/hktdc.png" alt="HKTDC" />
            <img src="/assets/clients/dashi.png" alt="Dashi" />
            <img src="/assets/clients/miraplace.png" alt="Mira Place" />
            <img src="/assets/clients/en.png" alt="Client" />
            <img src="/assets/clients/singtel.png" alt="" />
            <img src="/assets/clients/chinamobile.png" alt="" />
            <img src="/assets/clients/tencent.png" alt="" />
            <img src="/assets/clients/hktdc.png" alt="" />
            <img src="/assets/clients/dashi.png" alt="" />
            <img src="/assets/clients/miraplace.png" alt="" />
            <img src="/assets/clients/en.png" alt="" />
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="cta-banner reveal">
          <div>
            <h2 data-i18n="home.ctaTitle"></h2>
            <p data-i18n="home.ctaSub"></p>
          </div>
          <a class="btn btn-primary" href="/solutions/" data-i18n="home.ctaBtn"></a>
        </div>
      </div>
    </section>

  </main>
  <div id="site-footer-mount"></div>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
