<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Pudu Robotics at Robocore HK — PuduBot 2, BellaBot, CC1, MT1, SH1, FlashBot and more commercial service robots." />
  <meta name="theme-color" content="#141416" />
  <link rel="icon" href="/assets/logo/favicon.png" type="image/png" />
  <title>Robocore Hong Kong</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body data-page="pudu">
  <div id="site-header-mount"></div>
  <main>

    <section class="page-hero">
      <div class="container reveal">
        <div class="breadcrumb">
          <a href="/" data-i18n="common.home"></a><span>/</span>
          <a href="/products/" data-i18n="nav.products"></a><span>/</span>
          <span data-i18n="pudu.title"></span>
        </div>
        <h1 data-i18n="pudu.title"></h1>
        <p class="chip" style="display:inline-flex" data-i18n="prod.pudu.tag"></p>
      </div>
    </section>

    <section class="section">
      <div class="container split">
        <div class="detail-media reveal" style="position:static">
          <img src="/assets/products/pudu.png" alt="Pudu Robotics" style="max-height:420px;width:auto;object-fit:contain" />
        </div>
        <div class="reveal">
          <div class="section-kicker">Partner Brand</div>
          <h2 data-i18n="pudu.title"></h2>
          <p data-i18n="pudu.body"></p>
          <p data-i18n="pudu.tech"></p>
          <div class="hero-actions" style="margin-top:1.25rem">
            <a class="btn btn-primary" href="/contactus/" data-i18n="common.contactCta"></a>
            <a class="btn btn-ghost" href="/products/" data-i18n="pudu.backProducts"></a>
          </div>
        </div>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <div class="section-kicker">Pudu</div>
            <h2 data-i18n="pudu.lineupTitle"></h2>
            <p data-i18n="pudu.lineupSub"></p>
          </div>
        </div>

        <h3 class="pudu-cat-title reveal" data-i18n="pudu.cat.delivery"></h3>
        <div class="card-grid card-grid-2" style="margin-bottom:2.5rem">
          <a class="card pudu-product-card reveal" id="pudubot" href="/pudubot/">
            <div class="card-media pudu-media">
              <img src="/assets/products/pudu/pudubot.png" alt="PuduBot 2" />
            </div>
            <h3>PuduBot 2</h3>
            <p class="chip" data-i18n="nav.type.foodDelivery"></p>
            <p data-i18n="pudu.pudubot.desc"></p>
            <span class="card-link" data-i18n="pudu.viewSpecs"></span>
          </a>
          <a class="card pudu-product-card reveal" id="bellabot" href="/bellabot/">
            <div class="card-media pudu-media">
              <img src="/assets/products/pudu/bellabot-v2.png" alt="BellaBot" />
            </div>
            <h3>BellaBot</h3>
            <p class="chip" data-i18n="nav.type.premiumFood"></p>
            <p data-i18n="pudu.bellabot.desc"></p>
            <span class="card-link" data-i18n="pudu.viewSpecs"></span>
          </a>
          <a class="card pudu-product-card reveal" id="flashbot" href="/flashbot/">
            <div class="card-media pudu-media">
              <img src="/assets/products/pudu/flashbot.png" alt="FlashBot" />
            </div>
            <h3>FlashBot</h3>
            <p class="chip" data-i18n="nav.type.buildingDelivery"></p>
            <p data-i18n="pudu.flashbot.desc"></p>
            <span class="card-link" data-i18n="pudu.viewSpecs"></span>
          </a>
        </div>

        <h3 class="pudu-cat-title reveal" data-i18n="pudu.cat.cleaning"></h3>
        <div class="card-grid card-grid-2">
          <a class="card pudu-product-card reveal" id="cc1" href="/cc1/">
            <div class="card-media pudu-media">
              <img src="/assets/products/pudu/cc1.png" alt="CC1" />
            </div>
            <h3>CC1</h3>
            <p class="chip" data-i18n="nav.type.sweepScrub"></p>
            <p data-i18n="pudu.cc1.desc"></p>
            <span class="card-link" data-i18n="pudu.viewSpecs"></span>
          </a>
          <a class="card pudu-product-card reveal" id="mt1" href="/mt1/">
            <div class="card-media pudu-media">
              <img src="/assets/products/pudu/mt1.png" alt="MT1" />
            </div>
            <h3>MT1</h3>
            <p class="chip" data-i18n="nav.type.bulkWaste"></p>
            <p data-i18n="pudu.mt1.desc"></p>
            <span class="card-link" data-i18n="pudu.viewSpecs"></span>
          </a>
          <a class="card pudu-product-card reveal" id="sh1" href="/sh1/">
            <div class="card-media pudu-media">
              <img src="/assets/products/pudu/sh1.png" alt="SH1" />
            </div>
            <h3>SH1</h3>
            <p class="chip" data-i18n="nav.type.uprightScrub"></p>
            <p data-i18n="pudu.sh1.desc"></p>
            <span class="card-link" data-i18n="pudu.viewSpecs"></span>
          </a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="cta-banner reveal">
          <div>
            <h2 data-i18n="pudu.ctaTitle"></h2>
            <p data-i18n="pudu.ctaSub"></p>
          </div>
          <a class="btn btn-primary" href="/contactus/" data-i18n="common.contactCta"></a>
        </div>
      </div>
    </section>

  </main>
  <div id="site-footer-mount"></div>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
