<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Pudu Robotics at Robocore HK — PuduBot, BellaBot, CC1, MT1, SH1, FlashBot and more commercial service robots." />
  <meta name="theme-color" content="#141416" />
  <link rel="icon" href="/assets/logo/favicon.png" type="image/png" />
  <title>普渡科技 | Robocore Hong Kong</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body data-page="pudu.html">
  <div id="site-header-mount"></div>
  <main>

    <section class="page-hero">
      <div class="container reveal">
        <div class="breadcrumb">
          <a href="index.html" data-i18n="common.home"></a><span>/</span>
          <a href="products.html" data-i18n="nav.products"></a><span>/</span>
          <span data-i18n="pudu.title"></span>
        </div>
        <h1 data-i18n="pudu.title"></h1>
        <p class="chip" style="display:inline-flex" data-i18n="prod.pudu.tag"></p>
      </div>
    </section>

    <section class="section">
      <div class="container split">
        <div class="detail-media reveal" style="position:static">
          <img src="/assets/products/pudu.png" alt="Pudu Robotics" style="max-height:420px;width:auto;object-fit:contain" />
        </div>
        <div class="reveal">
          <div class="section-kicker">Partner Brand</div>
          <h2 data-i18n="pudu.title"></h2>
          <p data-i18n="pudu.body"></p>
          <p data-i18n="pudu.tech"></p>
          <div class="hero-actions" style="margin-top:1.25rem">
            <a class="btn btn-primary" href="contactus.html" data-i18n="common.contactCta"></a>
            <a class="btn btn-ghost" href="products.html" data-i18n="pudu.backProducts"></a>
          </div>
        </div>
      </div>
    </section>

        <div class="section-head reveal">
          <div>

            <h2 data-i18n="pudu.lineupTitle"></h2>
            <p data-i18n="pudu.lineupSub"></p>
          </div>
        </div>

        <h3 class="pudu-cat-title reveal" data-i18n="pudu.cat.delivery"></h3>
        <div class="card-grid card-grid-2" style="margin-bottom:2.5rem">
          <article class="card pudu-product-card reveal" id="pudubot">
            <div class="card-media pudu-media">
              <img src="/assets/products/pudu/pudubot.png" alt="PuduBot" />
            </div>
            <h3>PuduBot</h3>
            <p class="chip" style="align-self:flex-start;margin-bottom:0.75rem" data-i18n="pudu.pudubot.tag"></p>
            <p data-i18n="pudu.pudubot.desc"></p>
            <div class="chip-row">
              <span class="chip" data-i18n="pudu.pudubot.c1"></span>
              <span class="chip" data-i18n="pudu.pudubot.c2"></span>
              <span class="chip" data-i18n="pudu.pudubot.c3"></span>
            </div>

          <article class="card pudu-product-card reveal" id="bellabot">

            <p data-i18n="pudu.holabot.desc"></p>

          <div>

            <p data-i18n="pudu.ctaSub"></p>

          <a class="btn btn-primary" href="contactus.html" data-i18n="common.contactCta"></a>

  <div id="site-footer-mount"></div>
