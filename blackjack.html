<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Blackjack patrol robot — Robocore Hong Kong" />
  <meta name="theme-color" content="#141416" />
  <link rel="icon" href="/assets/logo/favicon.png" type="image/png" />
  <title>Robocore Hong Kong</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body data-page="blackjack">
  <div id="site-header-mount"></div>
  <main class="product-page">
    <section class="product-hero">
      <div class="container product-hero-grid">
        <div class="product-hero-copy reveal">
          <div class="breadcrumb">
            <a href="/" data-i18n="common.home"></a><span>/</span>
            <a href="/temifamily/" data-i18n="nav.brand.temi"></a><span>/</span>
            <span data-i18n="blackjack.title"></span>
          </div>
          <div class="product-kicker">temi</div>
          <h1 data-i18n="blackjack.title"></h1>
          <p class="product-type" data-i18n="nav.type.patrol"></p>
          <p class="product-lead" data-i18n="blackjack.body"></p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="/contactus/" data-i18n="common.contactCta"></a>
            <a class="btn btn-ghost" href="/temifamily/" data-i18n="tf.backSeries"></a>
          </div>
        </div>
        <div class="product-stage reveal">
          <img src="/assets/products/blackjack.jpg" alt="Blackjack" />
        </div>
      </div>
    </section>

    <section class="product-specs">
      <div class="container reveal">
        <header class="product-specs-head">
          <div>
            <div class="product-kicker">temi</div>
            <h2 data-i18n="tf.specs"></h2>
          </div>
        </header>
        <div data-specs="blackjack"></div>
      </div>
    </section>
  </main>
  <div id="site-footer-mount"></div>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
