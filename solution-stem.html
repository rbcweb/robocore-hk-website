<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Robocore Hong Kong — robotics solutions" />
  <meta name="theme-color" content="#141416" />
  <link rel="icon" href="/assets/logo/favicon.png" type="image/png" />
  <title>Robocore Hong Kong</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body data-page="solution-stem">
  <div id="site-header-mount"></div>
  <main>
    <article class="solution-detail">
      <div class="container solution-detail-inner reveal">
        <div class="breadcrumb">
          <a href="/" data-i18n="common.home"></a><span>/</span>
          <a href="/solutions/" data-i18n="solutions.title"></a><span>/</span>
          <span data-i18n="sol.stem.title"></span>
        </div>
        <img class="card-icon sol-icon solution-detail-icon" src="/assets/solutions/stem.svg" alt="" width="96" height="96" />
        <h1 data-i18n="sol.stem.title"></h1>
        <p class="solution-lead" data-i18n="sol.stem.desc"></p>
        <div class="solution-body">
          <p data-i18n="sol.stem.body"></p>
        </div>
          <figure class="solution-figure">
            <img src="/assets/solutions/stem-poster.jpg" alt="" width="1200" height="1200" loading="lazy" />
            <figcaption data-i18n="sol.stem.caption"></figcaption>
          </figure>
          <div class="solution-video">
            <h2 class="solution-video-title" data-i18n="sol.demo"></h2>
            <div class="video-embed">
              <iframe
                src="https://www.youtube-nocookie.com/embed/Ou6tgkn5qhc"
                title="MIT Scratch + temi application"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
              ></iframe>
            </div>
          </div>

        <div class="solution-actions">
          <a class="btn btn-primary" href="/contactus/" data-i18n="common.contactCta"></a>
          <a class="btn btn-ghost" href="/solutions/" data-i18n="sol.back"></a>
        </div>
      </div>
    </article>
    <section class="section">
      <div class="container">
        <div class="cta-banner reveal">
          <div>
            <h2 data-i18n="sol.ctaTitle"></h2>
            <p data-i18n="contact.sub"></p>
          </div>
          <a class="btn btn-primary" href="/contactus/" data-i18n="common.contactCta"></a>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer-mount"></div>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
