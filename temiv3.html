<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="temi v3 multi-purpose smart ambassador — Robocore Hong Kong" />
  <meta name="theme-color" content="#141416" />
  <link rel="icon" href="/assets/logo/favicon.png" type="image/png" />
  <title>temi v3 | Robocore Hong Kong</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body data-page="temiv3.html">
  <div id="site-header-mount"></div>
  <main class="product-page">
    <section class="product-hero">
      <div class="container product-hero-grid">
        <div class="product-hero-copy reveal">
          <div class="breadcrumb">
            <a href="index.html" data-i18n="common.home"></a><span>/</span>
            <a href="temifamily.html" data-i18n="nav.brand.temi"></a><span>/</span>
            <span data-i18n="temiv3.title"></span>
          </div>
          <div class="product-kicker">temi</div>
          <h1 data-i18n="temiv3.title"></h1>
          <p class="product-type" data-i18n="nav.type.service"></p>
          <p class="product-lead" data-i18n="temiv3.body"></p>
          <div class="chip-row">
            <span class="chip" data-i18n="temiv3.a1"></span>
            <span class="chip" data-i18n="temiv3.a3"></span>
            <span class="chip" data-i18n="temiv3.a8"></span>
          </div>
          <div class="hero-actions">
            <a class="btn btn-primary" href="contactus.html" data-i18n="common.contactCta"></a>
            <a class="btn btn-ghost" href="temifamily.html" data-i18n="tf.backSeries"></a>
          </div>
        </div>
        <div class="product-stage reveal">
          <img src="/assets/products/temiv3-full.png" alt="temi v3" />
        </div>
      </div>
    </section>

    <section class="product-specs">
      <div class="container reveal">
        <header class="product-specs-head">
          <div>
            <div class="product-kicker">temi</div>
            <h2 data-i18n="tf.specs"></h2>
          </div>
        </header>
        <div data-specs="temiv3"></div>
      </div>
    </section>
  </main>
  <div id="site-footer-mount"></div>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
