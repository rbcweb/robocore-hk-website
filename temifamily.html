<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="temi robots at Robocore HK — temi v3, Platform, GO, GO PRO, Blackjack, Fourcast." />
  <meta name="theme-color" content="#141416" />
  <link rel="icon" href="/assets/logo/favicon.png" type="image/png" />
  <title>temi 系列 | Robocore Hong Kong</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body data-page="temifamily.html">
  <div id="site-header-mount"></div>
  <main>

    <section class="page-hero">
      <div class="container reveal">
        <div class="breadcrumb">
          <a href="index.html" data-i18n="common.home"></a><span>/</span>
          <a href="products.html" data-i18n="nav.products"></a><span>/</span>
          <span data-i18n="tf.title"></span>
        </div>
        <h1 data-i18n="tf.title"></h1>
        <p data-i18n="tf.sub"></p>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <div class="section-kicker">temi</div>
            <h2 data-i18n="nav.brand.temi"></h2>
            <p data-i18n="tf.sub"></p>
          </div>
        </div>

        <div class="card-grid card-grid-2">
          <article class="card pudu-product-card reveal" id="temiv3">
            <div class="card-media pudu-media">
              <img src="/assets/products/temiv3-full.png" alt="temi v3" />
            </div>
            <h3>temi v3</h3>
            <p class="chip" data-i18n="prod.temiv3.tag"></p>
            <p data-i18n="temiv3.body"></p>
            <div class="chip-row">
              <span class="chip" data-i18n="temiv3.a1"></span>
              <span class="chip" data-i18n="temiv3.a3"></span>
              <span class="chip" data-i18n="temiv3.a8"></span>
            </div>
          </article>

          <article class="card pudu-product-card reveal" id="temiplatform">
            <div class="card-media pudu-media">
              <img src="/assets/products/temiplatform.png" alt="temi Platform" />
            </div>
            <h3>temi Platform</h3>
            <p class="chip" data-i18n="prod.platform.tag"></p>
            <p data-i18n="platform.body"></p>
          </article>

          <article class="card pudu-product-card reveal" id="temigo">
            <div class="card-media pudu-media">
              <img src="/assets/products/temigo.jpg" alt="temi GO" />
            </div>
            <h3>temi GO</h3>
            <p class="chip" data-i18n="prod.go.tag"></p>
            <p data-i18n="go.body"></p>
          </article>

          <article class="card pudu-product-card reveal" id="temigopro">
            <div class="card-media pudu-media">
              <img src="/assets/products/temigopro.jpg" alt="temi GO PRO" />
            </div>
            <h3>temi GO PRO</h3>
            <p class="chip" data-i18n="prod.gopro.tag"></p>
            <p data-i18n="gopro.body"></p>
          </article>

          <article class="card pudu-product-card reveal" id="blackjack">
            <div class="card-media pudu-media">
              <img src="/assets/products/blackjack.jpg" alt="Blackjack" />
            </div>
            <h3>Blackjack</h3>
            <p class="chip" data-i18n="prod.blackjack.tag"></p>
            <p data-i18n="blackjack.body"></p>
          </article>

          <article class="card pudu-product-card reveal" id="fourcast">
            <div class="card-media pudu-media">
              <img src="/assets/products/fourcast.png" alt="Fourcast" />
            </div>
            <h3>Fourcast</h3>
            <p class="chip" data-i18n="prod.fourcast.tag"></p>
            <p data-i18n="fourcast.body"></p>
          </article>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="cta-banner reveal">
          <div>
            <h2 data-i18n="common.contactCta"></h2>
            <p data-i18n="tf.sub"></p>
          </div>
          <a class="btn btn-primary" href="contactus.html" data-i18n="common.contactCta"></a>
        </div>
      </div>
    </section>

  </main>
  <div id="site-footer-mount"></div>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
