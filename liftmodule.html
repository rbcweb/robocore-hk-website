<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Robocore Hong Kong — 專業機械人綜合解決方案供應商 | Professional robotics solutions" />
  <meta name="theme-color" content="#141416" />
  <link rel="icon" href="/assets/logo/favicon.png" type="image/png" />
  <title>Robocore Hong Kong</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body data-page="liftmodule">
  <div id="site-header-mount"></div>
  <main>

    <section class="page-hero">
      <div class="container reveal">
        <div class="breadcrumb">
          <a href="/" data-i18n="common.home"></a><span>/</span>
          <a href="/products/" data-i18n="nav.products"></a><span>/</span>
          <span data-i18n="lift.title"></span>
        </div>
        <h1 data-i18n="lift.title"></h1>
        <p class="chip" style="display:inline-flex" data-i18n="prod.lift.tag"></p>
      </div>
    </section>
    <section class="section">
      <div class="container detail-stack">
        <div class="detail-stack-media reveal">
          <img
            src="/assets/products/liftmodule.jpg"
            alt="Lift Module"
            width="1200"
            height="800"
          />
        </div>
        <div class="detail-stack-copy reveal">
          <p data-i18n="lift.body"></p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="/contactus/" data-i18n="common.contactCta"></a>
            <a class="btn btn-ghost" href="/products/" data-i18n="nav.products"></a>
          </div>
        </div>
      </div>
    </section>

  </main>
  <div id="site-footer-mount"></div>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
