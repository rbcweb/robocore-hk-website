<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Robocore Hong Kong — 專業機械人綜合解決方案供應商 | Professional robotics solutions" />
  <meta name="theme-color" content="#141416" />
  <link rel="icon" href="/assets/logo/favicon.png" type="image/png" />
  <title>聯絡我們 | Robocore Hong Kong</title>
  <link rel="stylesheet" href="/src/css/main.css" />
  
</head>
<body data-page="contactus">
  <div id="site-header-mount"></div>
  <main>

    <section class="page-hero">
      <div class="container reveal">
        <div class="breadcrumb"><a href="/" data-i18n="common.home"></a><span>/</span><span data-i18n="contact.title"></span></div>
        <h1 data-i18n="contact.title"></h1>
        <p data-i18n="contact.sub"></p>
      </div>
    </section>
    <section class="section">
      <div class="container contact-grid">
        <div class="contact-card reveal">
          <div class="contact-item">
            <strong data-i18n="common.email"></strong>
            <p><a href="mailto:info@robocore.ai">info@robocore.ai</a></p>
          </div>
          <div class="contact-item">
            <strong data-i18n="common.addressLabel"></strong>
            <p data-i18n="common.address"></p>
          </div>
          <div class="contact-item">
            <strong data-i18n="common.company"></strong>
            <p data-i18n="common.member"></p>
          </div>
          <div class="contact-item">
            <strong data-i18n="common.follow"></strong>
            <div class="socials" data-socials></div>
          </div>
        </div>
        <div class="form-card reveal">
          <form id="contact-form">
            <div class="form-row">
              <label data-i18n="contact.formName"></label>
              <input name="name" required autocomplete="name" />
            </div>
            <div class="form-row">
              <label data-i18n="contact.formEmail"></label>
              <input name="email" type="email" required autocomplete="email" />
            </div>
            <div class="form-row">
              <label data-i18n="contact.formCompany"></label>
              <input name="company" autocomplete="organization" />
            </div>
            <div class="form-row">
              <label data-i18n="contact.formMsg"></label>
              <textarea name="message" required></textarea>
            </div>
            <p style="font-size:0.85rem;color:var(--text-muted)" data-i18n="contact.formNote"></p>
            <button class="btn btn-primary" type="submit" data-i18n="common.send"></button>
          </form>
        </div>
      </div>
    </section>

  </main>
  <div id="site-footer-mount"></div>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
